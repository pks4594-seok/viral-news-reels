name: trend_reel_studio
description: "뉴스를 바이럴 릴스로 — AI 기반 숏폼 콘텐츠 자동화 스튜디오"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 상태 관리
  provider: 6.1.5+1

  # 네트워킹 (뉴스 수집 / RSS)
  http: 1.5.0

  # 로컬 저장
  shared_preferences: 2.5.3
  hive: 2.2.3
  hive_flutter: 1.1.0
  xml: ^6.6.1
  intl: ^0.20.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
